name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo keeps only lib/ and test/. Generate the Android project here.
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name ig_follow --org com.example .
          fi
          # flutter create also makes a sample test that would fail against this app
          rm -f test/widget_test.dart

      - name: Allow internet access in the manifest
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || \
            sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' "$f"

      - run: flutter pub get

      # Copying the key to ~/.android/debug.keystore did not change the signature, so
      # point the release build at the committed keystore explicitly.
      - name: Sign the release build with the committed key
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert s.count(old) == 1, 'release signing line not found'
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("committed")')
          block = '''    signingConfigs {
              create("committed") {
                  storeFile = rootProject.file("../signing/debug.keystore")
                  storePassword = "android"
                  keyAlias = "androiddebugkey"
                  keyPassword = "android"
              }
          }
          '''
          anchor = '    buildTypes {'
          assert s.count(anchor) == 1, 'buildTypes anchor not found'
          p.write_text(s.replace(anchor, block + anchor))
          PYEOF
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      # Fail the build unless the APK is signed with the committed key. Installs
      # over an existing app only work when the signatures match.
      - name: Verify APK signature matches the committed key
        run: |
          expected=$(keytool -list -v -keystore signing/debug.keystore -storepass android \
            -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            > "$RUNNER_TEMP/apksigner.txt" || true
          cat "$RUNNER_TEMP/apksigner.txt"
          actual=$(grep -i 'SHA-256 digest' "$RUNNER_TEMP/apksigner.txt" \
            | grep -oE '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')
          echo "expected certificate SHA-256: $expected"
          echo "APK certificate SHA-256:      $actual"
          test -n "$expected" && test "$expected" = "$actual"

      - uses: actions/upload-artifact@v4
        with:
          name: ig-follow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
